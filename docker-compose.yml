services:
  backend:
    build: ./Backend
    ports:
      - "8000:8000"

    env_file:
      - ./Backend/.env

    depends_on:
      - redis
      - database

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  database:
    image: mongo:7-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
